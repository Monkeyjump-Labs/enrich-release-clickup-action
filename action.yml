name: 'Enrich Release Notes with ClickUp Links'
description: 'Fetches release notes by release ID, finds linked PRs, retrieves associated ClickUp tasks, and updates the release body.'

inputs:
  github_token:
    description: 'GITHUB_TOKEN or a repo scoped PAT'
    default: ${{ github.token }}
    required: false
  release_number:
    description: "Release ID or Tag (e.g. '210470574' or '1.1.205')"
    required: true
  clickup_team_id:
    description: 'ClickUp workspace (team) ID. When set, ticket tags such as #SMART-1234 in the release notes are linked as https://app.clickup.com/t/<team_id>/SMART-1234'
    default: ''
    required: false

runs:
  using: 'composite'
  steps:
    # Required for github-script to access the repository content if needed
    - name: Checkout (required by actions/github-script)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Enrich release notes
      uses: actions/github-script@v7
      env:
        RELEASE_NUMBER: ${{ inputs.release_number }}
        CLICKUP_TEAM_ID: ${{ inputs.clickup_team_id }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const releaseNumber = process.env.RELEASE_NUMBER;
          console.log(`🔍 Attempting to fetch release by ID or Tag: ${releaseNumber}`);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const fetchRelease = async () => {
            // If purely numeric, treat it as a release ID
            if (/^\d+$/.test(releaseNumber)) {
              try {
                const { data } = await github.rest.repos.getRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: Number(releaseNumber),
                });
                return data;
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            }
            // Paginate so we search ALL releases, including drafts
            // (getReleaseByTag does not return draft releases)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            return releases.find(r => r.tag_name === releaseNumber);
          };

          // The release may not be visible in the API immediately after
          // creation, so retry with backoff before giving up.
          let release;
          const delaysMs = [0, 5000, 10000, 20000, 30000];
          for (const [attempt, delayMs] of delaysMs.entries()) {
            if (delayMs > 0) {
              console.log(`⏳ Release not found yet, retrying in ${delayMs / 1000}s (attempt ${attempt + 1}/${delaysMs.length})...`);
              await sleep(delayMs);
            }
            release = await fetchRelease();
            if (release) break;
          }

          if (!release) {
            core.setFailed(`❌ Release not found for ID or tag: ${releaseNumber}`);
            return;
          }

          // 2) Pull out the body (text) of the release.
          const body = release.body || '';
          console.log(`🔍 Processing release: ${release.name} (ID: ${release.id})`);

          const teamId = (process.env.CLICKUP_TEAM_ID || '').trim();
          if (!teamId) {
            console.log('ℹ️ clickup_team_id not set, so ticket tags like #SMART-1234 will not be linked');
          }

          // 3) Find the bullet lines that link a PR. GitHub's generated notes link
          //    ".../pull/123"; release-please links the same PR as ".../issues/123".
          //    The PR link is the last such link on the line (release-please also links
          //    "#120" mentions in the subject before it), hence the greedy prefix.
          const prLineRegex = /^([ \t]*)[*-] .*https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/(?:pull|issues)\/(\d+)\b.*$/gm;
          const prNumbers = [...new Set([...body.matchAll(prLineRegex)].map((m) => parseInt(m[2])))];

          console.log(`🧾 Found ${prNumbers.length} unique PR(s): ${prNumbers.join(', ')}`);

          // A task is { key, label, url }. The key is the ticket ID when the label starts
          // with one (SMART-1234, CU-868abc), otherwise the URL, so the same ticket found
          // twice is listed once.
          const toTask = (label, url) => {
            const first = label.trim().split(/\s+/)[0];
            const key = /^[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+$/.test(first) ? first.toUpperCase() : url;
            return { key, label: label.trim(), url };
          };

          // 4) For each PR, read every comment and collect the ClickUp tasks it links:
          //    v1 of enrich-pr-clickup-action writes
          //      "Task linked: [CU-XXXXX My Task](https://app.clickup.com/t/XXXXX)"
          //    v2 writes a heading and a field list
          //      "### 🎟️ SMART-1234 — My Task"
          //      "- **Ticket**: [SMART-1234](https://app.clickup.com/t/XXXXX)"
          // The URL path may be a standard task ID (/t/868d03kjk) or a custom ID with a
          // team segment (/t/9001234567/SMART-1234), so capture up to the closing paren.
          const taskLinkedRegex = /^Task linked:\s+\[(.*)\]\((https:\/\/app\.clickup\.com\/t\/[^)\s]+)\)/;
          const ticketFieldRegex = /^\s*[*-]\s+\*\*Ticket\*\*:\s+\[([^\]]+)\]\((https:\/\/app\.clickup\.com\/t\/[^)\s]+)\)/;
          const ticketHeadingRegex = /^#{1,6}\s+\S+\s+(\S+)\s+—\s+(.+?)\s*$/;
          const prToTasksMap = {};

          for (const pr of prNumbers) {
            console.log(`\n➡️ Checking PR #${pr}`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });

            console.log(`💬 Found ${comments.length} comment(s) on PR #${pr}`);

            const tasks = [];
            for (const comment of comments) {
              // v2 embeds the ticket's description in a <details> block; ignore it, so
              // text quoted there can't add tasks or rename this one.
              const allLines = (comment.body || '').split(/\r?\n/);
              const detailsAt = allLines.findIndex((l) => /^\s*<details>/i.test(l));
              const lines = detailsAt === -1 ? allLines : allLines.slice(0, detailsAt);
              const names = {};
              for (const line of lines) {
                const heading = line.match(ticketHeadingRegex);
                if (heading && !names[heading[1]]) names[heading[1]] = heading[2];
              }
              for (const line of lines) {
                const linked = line.match(taskLinkedRegex);
                const field = line.match(ticketFieldRegex);
                if (linked) {
                  tasks.push(toTask(linked[1], linked[2]));
                } else if (field) {
                  const id = field[1].trim();
                  // Escape brackets and backslashes so the name can't end the link text early.
                  const name = names[id] && names[id].replace(/[\\[\]]/g, '\\$&');
                  tasks.push(toTask(name ? `${id} ${name}` : id, field[2]));
                } else {
                  continue;
                }
                const task = tasks[tasks.length - 1];
                console.log(`🔗 Found ClickUp task: ${task.label} (${task.url})`);
              }
            }

            if (tasks.length > 0) {
              prToTasksMap[pr] = tasks;
              console.log(`✅ Associating ${tasks.length} task(s) with PR #${pr}`);
            } else {
              console.log(`🚫 No task links found in comments for PR #${pr}`);
            }
          }

          // Ticket tags such as #SMART-1234 on the line itself (release-please copies them
          // from the PR title). They need the team ID to form a custom-ID URL. ClickUp
          // custom-ID prefixes are upper case, which keeps "#utf-8" and "#step-2" out; the
          // lookbehind skips URL fragments like "#issuecomment-123".
          const ticketTagRegex = /(?<![\w/#-])#([A-Z][A-Z0-9]*-\d+)\b/g;
          const tagTasks = (line) =>
            teamId
              ? [...line.matchAll(ticketTagRegex)].map((m) => {
                  const id = m[1];
                  return toTask(id, `https://app.clickup.com/t/${encodeURIComponent(teamId)}/${id}`);
                })
              : [];

          // 5) Insert sub-bullets into the release notes, under the whole PR line. A task
          //    found in a PR comment replaces the same ticket's tag link, since the
          //    comment carries the task's name.
          console.log(`\n🛠 Updating release notes...`);
          const updatedBody = body.replace(prLineRegex, (line, indent, prStr, offset, whole) => {
            const pr = parseInt(prStr);
            const merged = new Map();
            for (const task of [...tagTasks(line), ...(prToTasksMap[pr] || [])]) merged.set(task.key, task);
            if (merged.size === 0) return line;

            // A re-run on notes that were already enriched, or edited since (CRLF line
            // endings after a web-UI edit), adds only the ClickUp links not yet listed
            // under this line.
            const existing = [];
            for (const next of whole.slice(offset + line.length).split(/\r?\n/).slice(1)) {
              const sub = next.match(/^[ \t]+[*-] \[.*\]\((https:\/\/app\.clickup\.com\/t\/[^)\s]+)\)\s*$/);
              if (!sub || next.length - next.trimStart().length <= indent.length) break;
              existing.push(sub[1]);
            }
            const missing = [...merged.values()].filter((t) => !existing.includes(t.url));
            if (missing.length === 0) {
              console.log(`⏭️ Sub-bullets already present for PR #${pr}`);
              return line;
            }
            console.log(`📌 Inserting ${missing.length} sub-bullet(s) for PR #${pr}`);
            return `${line}\n${missing.map((t) => `${indent}  - [${t.label}](${t.url})`).join('\n')}`;
          });

          // 6) Only update if there's a change
          if (updatedBody !== body) {
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              tag_name: release.tag_name,
              draft: release.draft,
              prerelease: release.prerelease,
              body: updatedBody,
            });
            console.log("🎉 Release notes updated with ClickUp links.");
          } else {
            console.log("🟰 No updates made to release notes.");
          }
